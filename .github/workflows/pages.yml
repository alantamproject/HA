# Static site: validate ("build") then deploy to GitHub Pages on every
# push to main. Single job — deploy-pages@v4 consumes the artifact that
# upload-pages-artifact stores in the same job.
name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build / verify static site
        run: |
          test -f index.html || { echo "::error::index.html missing"; exit 1; }
          grep -qi '<html' index.html || { echo "::error::index.html not valid HTML"; exit 1; }
          echo "static site verified"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
